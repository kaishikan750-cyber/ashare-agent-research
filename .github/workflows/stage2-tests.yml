name: Stage 2 research checks
on: [push, pull_request]
jobs:
  stage2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-stage3-lock.txt
      - run: python -m pip install -r requirements-stage3-lock.txt
      - run: python -m pip check
      - run: python -m pytest tests -q
